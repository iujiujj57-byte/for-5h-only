<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexPlay — Game Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">🎮 NEXPLAY</div>
  <nav>
    <a href="#games">Games</a>
    <a href="#about">About</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Ready. Set. <span>PLAY.</span></h1>
    <p>Discover your next favourite browser game.</p>
    <div class="search-wrap">
      <input class="search" id="search" type="search" placeholder="Search game websites…" aria-label="Search game websites">
    </div>
  </div>
</section>

<div class="categories">
  <button class="active" data-category="all">All Sites</button>
  <button data-category="games">Game Hubs</button>
  <button data-category="community">Community</button>
  <button data-category="other">Other Links</button>
</div>

<main id="games">
  <h2 class="section-title">✦ Explore Game Sites</h2>
  <div class="game-grid" id="gameGrid"></div>
  <p id="empty" hidden>No websites found. Try another search.</p>
</main>

<footer id="about">
  <p>© <span id="year"></span> NexPlay · Your browser game directory</p>
</footer>

<script>
const sites = [
  { name: "Soupcan Games", url: "https://soupcan.pages.dev/g", icon: "🥫", category: "games", description: "Explore the Soupcan game collection." },
  { name: "Kylebob", url: "https://kylebob.com/", icon: "🕹️", category: "games", description: "A browser game website." },
  { name: "Chicken Kings Vault", url: "https://wanocapy.github.io/ChickenKingsVault/", icon: "🐔", category: "games", description: "Explore Chicken Kings Vault." },
  { name: "Coolmath Games", url: "https://www.coolmathgames.com/", icon: "🧩", category: "games", description: "Puzzles, strategy and casual games." },
  { name: "GitHub Games", url: "https://githubgames.gitlab.io/", icon: "🐙", category: "community", description: "Browse a collection of game links." },
  { name: "GitLab Games", url: "https://gitlabgames.gitlab.io/", icon: "🦊", category: "community", description: "Discover more browser games." },
  { name: "Velara", url: "http://velara.cc", icon: "💜", category: "games", description: "Open the Velara website." },
  { name: "DaydreamX", url: "https://daydreamx.pro/app/index.html", icon: "🌙", category: "games", description: "Visit the DaydreamX website." },
  { name: "55Gms", url: "https://55gms.com/", icon: "🎯", category: "games", description: "Visit the 55Gms game website." },
  { name: "Orchid Idea", url: "https://ideas.orchid-idea.com/", icon: "🌐", category: "other", description: "Unverified external link." },
  { name: "Levitr", url: "https://f3a4e576.levitr.cfd/", icon: "🔗", category: "other", description: "Unverified external link." },
  { name: "Patel Mortgage Subdomain", url: "https://homerosin.patelmortgage.com/", icon: "🔗", category: "other", description: "Unverified link; not obviously a game site." },
  { name: "SVG File", url: "https://cdn.jsdelivr.net/gh/homeworkpractive/svg@main/index.svg", icon: "📄", category: "other", description: "An SVG file link, not a standard game page." }
];

const grid = document.getElementById("gameGrid");
const search = document.getElementById("search");
const empty = document.getElementById("empty");
const buttons = document.querySelectorAll("[data-category]");

let selectedCategory = "all";

function renderGames() {
  const query = search.value.toLowerCase().trim();

  const filtered = sites.filter(site => {
    const matchesSearch = (site.name + " " + site.description).toLowerCase().includes(query);
    const matchesCategory = selectedCategory === "all" || site.category === selectedCategory;
    return matchesSearch && matchesCategory;
  });

  grid.innerHTML = "";

  filtered.forEach(site => {
    const card = document.createElement("a");
    card.className = "game-card";
    card.href = site.url;
    card.target = "_blank";
    card.rel = "noopener noreferrer";

    card.innerHTML = `
      <div class="game-icon">${site.icon}</div>
      <h3>${site.name}</h3>
      <p>${site.description}</p>
      <span class="open-link">Open Website ↗</span>
    `;

    grid.appendChild(card);
  });

  empty.hidden = filtered.length !== 0;
}

search.addEventListener("input", renderGames);

buttons.forEach(button => {
  button.addEventListener("click", () => {
    selectedCategory = button.dataset.category;
    buttons.forEach(item => item.classList.toggle("active", item === button));
    renderGames();
  });
});

document.getElementById("year").textContent = new Date().getFullYear();
renderGames();
</script>

</body>
</html>
