
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexPlay - Game Hub</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #09070f;
  color: #f7f4ff;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #292039;
  background: #0d0a14;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #a78bfa;
}

nav a {
  color: #ccc3df;
  text-decoration: none;
  margin-left: 20px;
}

.hero {
  text-align: center;
  padding: 85px 20px 55px;
}

.hero h1 {
  font-size: clamp(42px, 7vw, 76px);
  margin-bottom: 20px;
}

.hero h1 span {
  color: #a78bfa;
}

.hero p {
  color: #aaa3bb;
  font-size: 18px;
  margin-bottom: 30px;
}

.search {
  display: block;
  width: min(550px, 100%);
  margin: auto;
  padding: 15px 18px;
  background: #171220;
  border: 1px solid #49326c;
  border-radius: 12px;
  color: white;
  font-size: 16px;
  outline: none;
}

.search:focus {
  border-color: #a78bfa;
  box-shadow: 0 0 15px #8b5cf633;
}

.categories {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 10px 20px 35px;
}

.categories button {
  background: #191426;
  color: #d8c9ff;
  border: 1px solid #352747;
  padding: 10px 17px;
  border-radius: 30px;
  cursor: pointer;
}

.categories button:hover,
.categories button.active {
  background: #7c3aed;
  color: white;
}

main {
  width: 86%;
  max-width: 1200px;
  margin: auto;
}

.section-title {
  font-size: 27px;
  margin-bottom: 25px;
}

.game-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  padding-bottom: 60px;
}

.game-card {
  display: block;
  padding: 22px;
  border: 1px solid #30243f;
  border-radius: 17px;
  background: linear-gradient(145deg, #191426, #100d17);
  text-decoration: none;
  color: white;
  transition: 0.2s;
}

.game-card:hover {
  transform: translateY(-5px);
  border-color: #a78bfa;
  box-shadow: 0 8px 28px #8b5cf622;
}

.game-icon {
  font-size: 35px;
  margin-bottom: 18px;
}

.game-card h3 {
  font-size: 20px;
  margin-bottom: 9px;
}

.game-card p {
  color: #aaa3bb;
  font-size: 14px;
  line-height: 1.5;
}

.open-link {
  display: block;
  color: #b99aff;
  margin-top: 20px;
  font-weight: bold;
}

footer {
  border-top: 1px solid #292039;
  padding: 25px;
  text-align: center;
  color: #898197;
}

@media (max-width: 800px) {
  .game-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 520px) {
  header {
    padding: 18px 5%;
  }

  nav a {
    margin-left: 8px;
    font-size: 13px;
  }

  main {
    width: 90%;
  }

  .game-grid {
    grid-template-columns: 1fr;
  }

  .hero {
    padding-top: 60px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🎮 NEXPLAY</div>
  <nav>
    <a href="#games">Games</a>
    <a href="#about">About</a>
  </nav>
</header>

<section class="hero">
  <h1>Ready. Set. <span>PLAY.</span></h1>
  <p>Discover your next favourite browser game.</p>

  <input
    class="search"
    id="search"
    type="search"
    placeholder="🔍 Search game websites..."
    aria-label="Search game websites"
  >
</section>

<div class="categories">
  <button class="active" data-category="all">All Sites</button>
  <button data-category="games">Game Hubs</button>
  <button data-category="community">Community</button>
  <button data-category="other">Other Links</button>
</div>

<main id="games">
  <h2 class="section-title">✦ Explore Game Sites</h2>
  <div class="game-grid" id="gameGrid"></div>
  <p id="empty" hidden>No websites found. Try another search.</p>
</main>

<footer id="about">
  <p>© <span id="year"></span> NexPlay · Your browser game directory</p>
</footer>

<script>
const sites = [
  {
    name: "Soupcan Games",
    url: "https://soupcan.pages.dev/g",
    icon: "🥫",
    category: "games",
    description: "Explore the Soupcan game collection."
  },
  {
    name: "Kylebob",
    url: "https://kylebob.com/",
    icon: "🕹️",
    category: "games",
    description: "A browser game website."
  },
  {
    name: "Chicken Kings Vault",
    url: "https://wanocapy.github.io/ChickenKingsVault/",
    icon: "🐔",
    category: "games",
    description: "Explore Chicken Kings Vault."
  },
  {
    name: "Coolmath Games",
    url: "https://www.coolmathgames.com/",
    icon: "🧩",
    category: "games",
    description: "Puzzles, strategy and casual games."
  },
  {
    name: "GitHub Games",
    url: "https://githubgames.gitlab.io/",
    icon: "🐙",
    category: "community",
    description: "Browse a collection of game links."
  },
  {
    name: "GitLab Games",
    url: "https://gitlabgames.gitlab.io/",
    icon: "🦊",
    category: "community",
    description: "Discover more browser games."
  },
  {
    name: "Velara",
    url: "http://velara.cc",
    icon: "💜",
    category: "games",
    description: "Open the Velara website."
  },
  {
    name: "DaydreamX",
    url: "https://daydreamx.pro/app/index.html",
    icon: "🌙",
    category: "games",
    description: "Visit the DaydreamX website."
  },
  {
    name: "55Gms",
    url: "https://55gms.com/",
    icon: "🎯",
    category: "games",
    description: "Visit the 55Gms game website."
  },
  {
    name: "Orchid Idea",
    url: "https://ideas.orchid-idea.com/",
    icon: "🌐",
    category: "other",
    description: "Unverified external link."
  },
  {
    name: "Levitr",
    url: "https://f3a4e576.levitr.cfd/",
    icon: "🔗",
    category: "other",
    description: "Unverified external link."
  },
  {
    name: "Patel Mortgage Subdomain",
    url: "https://homerosin.patelmortgage.com/",
    icon: "🔗",
    category: "other",
    description: "Unverified link; not obviously a game site."
  },
  {
    name: "SVG File",
    url: "https://cdn.jsdelivr.net/gh/homeworkpractive/svg@main/index.svg",
    icon: "📄",
    category: "other",
    description: "An SVG file link, not a standard game page."
  }
];

const grid = document.getElementById("gameGrid");
const search = document.getElementById("search");
const empty = document.getElementById("empty");
const buttons = document.querySelectorAll("[data-category]");

let selectedCategory = "all";

function renderGames() {
  const query = search.value.toLowerCase().trim();

  const filtered = sites.filter(site => {
    const matchesSearch =
      (site.name + " " + site.description)
        .toLowerCase()
        .includes(query);

    const matchesCategory =
      selectedCategory === "all" ||
      site.category === selectedCategory;

    return matchesSearch && matchesCategory;
  });

  grid.innerHTML = "";

  filtered.forEach(site => {
    const card = document.createElement("a");
    card.className = "game-card";
    card.href = site.url;
    card.target = "_blank";
    card.rel = "noopener noreferrer";

    const icon = document.createElement("div");
    icon.className = "game-icon";
    icon.textContent = site.icon;

    const title = document.createElement("h3");
    title.textContent = site.name;

    const description = document.createElement("p");
    description.textContent = site.description;

    const link = document.createElement("span");
    link.className = "open-link";
    link.textContent = "Open Website ↗";

    card.append(icon, title, description, link);
    grid.appendChild(card);
  });

  empty.hidden = filtered.length !== 0;
}

search.addEventListener("input", renderGames);

buttons.forEach(button => {
  button.addEventListener("click", () => {
    selectedCategory = button.dataset.category;

    buttons.forEach(item => {
      item.classList.toggle("active", item === button);
    });

    renderGames();
  });
});

document.getElementById("year").textContent =
  new Date().getFullYear();

renderGames();
</script>

</body>
</html>
